[package]
name = "our-clipboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clipboard sharing between trusted computers"
repository = "https://github.com/daropotter/our-clipboard"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false }
rustix = { version = "1.1.5", features = ["event"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.4"
x11rb = { version = "0.13.2", features = ["xfixes"] }
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.3", features = ["monitor"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"] }
