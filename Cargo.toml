[package]
name = "our-clipboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clipboard sharing between trusted computers"
repository = "https://github.com/daropotter/our-clipboard"

[features]
default = ["clipboard", "os-keyring"]
clipboard = ["dep:arboard", "dep:clipboard-rs", "dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:wl-clipboard-rs", "dep:x11rb", "dep:zbus", "dep:clipboard-win", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
os-keyring = ["dep:keyring"]

[dependencies]
arboard = { version = "3.7.0", default-features = false, optional = true }
directories = "6"
getrandom = "0.3"
keyring = { version = "4", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
ring = "0.17.14"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tempfile = "3"
subtle = "2.6"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
webpki-roots = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["stdio"] }

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, optional = true }
rustix = { version = "1.1.5", features = ["event", "time"] }
wayland-client = { version = "0.31.15", optional = true }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"], optional = true }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"], optional = true }
wl-clipboard-rs = { version = "0.9.4", optional = true }
x11rb = { version = "0.13.2", features = ["xfixes"], optional = true }
zbus = { version = "5", features = ["blocking-api"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.3", features = ["monitor"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSString"], optional = true }

[[example]]
name = "synthetic-clipboard-sync"
path = "examples/synthetic-clipboard-sync.rs"
required-features = ["clipboard"]

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[[example]]
name = "logind-fixture"
path = "examples/logind-fixture.rs"
required-features = ["clipboard"]
