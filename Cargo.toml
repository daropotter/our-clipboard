[package]
name = "our-clipboard"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Clipboard sharing between trusted computers"
repository = "https://github.com/daropotter/our-clipboard"

[dependencies]
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"
x11rb = { version = "0.13.2", features = ["xfixes"] }
