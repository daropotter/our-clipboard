name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Preflight fixture ignores the parent Wayland session
        if: runner.os == 'Linux'
        run: XDG_SESSION_TYPE=wayland cargo test --locked --test cli -- --exact launch_check_is_read_only_and_runtime_consent_cannot_come_from_json
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --no-default-features
      - run: cargo run --locked --no-default-features -- transport-probe
      - run: cargo run --locked -- doctor
  native-clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --test clipboard -- --ignored --test-threads=1
  linux-clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --tests
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - name: Isolated X11 and native Wayland round trips
        shell: bash
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'clipboard-*' -print -quit)
          test -n "$binary"
          docker run --rm --network none \
            -e OUR_CLIPBOARD_TEST_CLI=/our-clipboard \
            -v "$PWD/target/debug/our-clipboard:/our-clipboard:ro" \
            -v "$PWD/target/debug/deps:/tests:ro" \
            -v "$PWD/tests/linux/run.sh:/run-tests.sh:ro" \
            our-clipboard-tests bash /run-tests.sh "/tests/$(basename "$binary")"
  kwin-clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --tests
      - run: docker build -t our-clipboard-kwin-tests -f tests/linux/Dockerfile.kwin .
      - name: Native KWin Wayland round trips
        shell: bash
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'clipboard-*' -print -quit)
          test -n "$binary"
          docker run --rm --network none \
            -e OUR_CLIPBOARD_TEST_CLI=/our-clipboard \
            -v "$PWD/target/debug/our-clipboard:/our-clipboard:ro" \
            -v "$PWD/target/debug/deps:/tests:ro" \
            -v "$PWD/tests/linux/run-kwin.sh:/run-tests.sh:ro" \
            our-clipboard-kwin-tests bash /run-tests.sh "/tests/$(basename "$binary")"
  gnome-clipboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --tests
      - run: docker build -t our-clipboard-gnome-tests -f tests/linux/Dockerfile.gnome .
      - name: GNOME 46 native Wayland clipboard tests
        shell: bash
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'clipboard-*' -print -quit)
          test -n "$binary"
          docker run --rm --network none --memory 2g \
            -e OUR_CLIPBOARD_TEST_CLI=/our-clipboard \
            -v "$PWD/target/debug/our-clipboard:/our-clipboard:ro" \
            -v "$PWD/target/debug/deps:/tests:ro" \
            -v "$PWD/gnome/our-clipboard@daropotter:/extension:ro" \
            -v "$PWD/tests/linux/run-gnome.sh:/run-tests.sh:ro" \
            our-clipboard-gnome-tests bash /run-tests.sh "/tests/$(basename "$binary")"
  two-clipboard-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - name: Two independent X11 clipboards over mutual TLS
        run: |
          docker run --rm --network none \
            -v "$PWD/target/debug/examples:/examples:ro" \
            -v "$PWD/tests/linux/run-sync.sh:/run-sync.sh:ro" \
            our-clipboard-tests bash /run-sync.sh /examples/synthetic-clipboard-sync
  interactive-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-pilot-tests -f tests/linux/Dockerfile.pilot .
      - name: Interactive native clipboard exchange over real private SSH
        run: |
          docker run --rm --network none \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
            -v "$PWD/tests/linux/run-pilot.sh:/run-pilot.sh:ro" \
            our-clipboard-pilot-tests bash /run-pilot.sh /pilot /helper
  outbound-relay-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
      - name: Outbound-only native pilot over WSS and pinned mutual TLS
        run: |
          docker run --rm --network none \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
            -v "$PWD/tests/linux/run-relay-pilot.py:/run-relay-pilot.py:ro" \
            our-clipboard-relay-tests python3 /run-relay-pilot.py /pilot /helper
  reconnect-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
      - name: Real WSS outage, original TTL, cancellation and auth rejection
        run: |
          for scenario in 1 auth stale; do
            docker run --rm --network none -e OUR_CLIPBOARD_TEST_RECONNECT="$scenario" \
              -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
              -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
              -v "$PWD/tests/linux/run-relay-pilot.py:/run-relay-pilot.py:ro" \
              -v "$PWD/tests/linux/reconnect_scenario.py:/reconnect_scenario.py:ro" \
              our-clipboard-relay-tests python3 /run-relay-pilot.py /pilot /helper
          done
  device-signed-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Private credential metadata probe tests
        run: python3 -m unittest discover -s tests/identity -p 'test_credential_probe.py' -v
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
      - run: docker build -t our-clipboard-signed-relay-tests -f tests/identity/Dockerfile.relay .
      - run: cargo test --locked --test identity_store --no-run
      - name: Native preflight fixture ignores the parent Wayland session
        shell: bash
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'identity_store-*' -print -quit)
          test -n "$binary"
          docker run --rm --network none -e XDG_SESSION_TYPE=wayland \
            -e OUR_CLIPBOARD_TEST_CLI=/pilot \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/deps:/tests:ro" \
            -v "$PWD/tests/identity/run.sh:/run-tests.sh:ro" \
            our-clipboard-signed-relay-tests bash /run-tests.sh "/tests/$(basename "$binary")"
      - name: System-store identity, signed offers, fresh processes and reconnect
        run: |
          docker run --rm --network none \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
            -v "$PWD/tests/linux/run-relay-pilot.py:/run-relay-pilot.py:ro" \
            -v "$PWD/tests/linux/reconnect_scenario.py:/reconnect_scenario.py:ro" \
            -v "$PWD/tests/identity/preflight_scenario.py:/preflight_scenario.py:ro" \
            -v "$PWD/tests/identity/peer_pin_scenario.py:/peer_pin_scenario.py:ro" \
            -v "$PWD/tests/identity/run-relay.sh:/run-signed-relay.sh:ro" \
            our-clipboard-signed-relay-tests bash /run-signed-relay.sh /pilot /helper
  wayland-relay-pilot:
    name: wayland-relay-pilot (${{ matrix.compositor }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - compositor: sway
            image: our-clipboard-signed-relay-tests
          - compositor: kwin
            image: our-clipboard-kwin-relay-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - name: Sway fixture image
        if: matrix.compositor == 'sway'
        run: |
          docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
          docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
          docker build -t our-clipboard-signed-relay-tests -f tests/identity/Dockerfile.relay .
      - name: KWin fixture image
        if: matrix.compositor == 'kwin'
        run: |
          docker build -t our-clipboard-kwin-tests -f tests/linux/Dockerfile.kwin .
          docker build -t our-clipboard-kwin-relay-tests -f tests/identity/Dockerfile.kwin-relay .
      - name: Experimental native Wayland and X11 over WSS, signed identity and reconnect
        env:
          OUR_CLIPBOARD_TEST_COMPOSITOR: ${{ matrix.compositor }}
        run: |
          docker run --rm --user tester --network none -e OUR_CLIPBOARD_TEST_WAYLAND=1 -e OUR_CLIPBOARD_TEST_COMPOSITOR \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
            -v "$PWD/tests/linux/run-relay-pilot.py:/run-relay-pilot.py:ro" \
            -v "$PWD/tests/linux/reconnect_scenario.py:/reconnect_scenario.py:ro" \
            -v "$PWD/tests/identity/preflight_scenario.py:/preflight_scenario.py:ro" \
            -v "$PWD/tests/identity/peer_pin_scenario.py:/peer_pin_scenario.py:ro" \
            -v "$PWD/tests/identity/run-relay.sh:/run-signed-relay.sh:ro" \
            ${{ matrix.image }} bash /run-signed-relay.sh /pilot /helper
  logind-idle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync --example logind-fixture
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
      - name: Private login1 sessions and native WSS Idle delivery
        run: |
          docker run --rm --network none \
            -v "$PWD/target/debug/our-clipboard:/pilot:ro" \
            -v "$PWD/target/debug/examples/synthetic-clipboard-sync:/helper:ro" \
            -v "$PWD/target/debug/examples/logind-fixture:/logind-fixture:ro" \
            -v "$PWD/tests/linux/run-relay-pilot.py:/run-relay-pilot.py:ro" \
            our-clipboard-relay-tests python3 /run-relay-pilot.py /pilot /helper /logind-fixture
  relay-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --bin our-clipboard --example synthetic-clipboard-sync
      - run: docker build -t our-clipboard-tests -f tests/linux/Dockerfile .
      - run: docker build -t our-clipboard-relay-tests -f tests/linux/Dockerfile.relay .
      - run: docker build -t our-clipboard-relay -f deploy/relay.Dockerfile .
      - name: Packaged non-root relay and native outbound clients
        run: python3 tests/linux/run-relay-container.py
  native-identity:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
        features: [os-keyring, "os-keyring,clipboard"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --no-default-features --features ${{ matrix.features }} --test identity_store -- --ignored --test-threads=1
  linux-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --no-default-features --features os-keyring --tests
      - run: docker build -t our-clipboard-keyring-tests -f tests/identity/Dockerfile .
      - name: Persistent identity through private Secret Service
        shell: bash
        run: |
          binary=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'identity_store-*' -print -quit)
          test -n "$binary"
          docker run --rm --network none \
            -e OUR_CLIPBOARD_TEST_CLI=/our-clipboard \
            -v "$PWD/target/debug/our-clipboard:/our-clipboard:ro" \
            -v "$PWD/target/debug/deps:/tests:ro" \
            -v "$PWD/tests/identity/run.sh:/run-tests.sh:ro" \
            our-clipboard-keyring-tests bash /run-tests.sh "/tests/$(basename "$binary")"
