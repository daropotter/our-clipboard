name: Retarget stacked PRs
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: retarget-stacked-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  retarget:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use the workflow's trusted revision, never the triggering PR's head.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const retarget = require('./.github/scripts/retarget-stacked.cjs');
            await retarget({github, context, core});
